# This is a Databricks asset bundle definition for credit_card_fraud.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: credit_card_fraud
  uuid: d3626835-71fa-4e8e-99cd-ad4824f3c959

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-8f4f65e6-359f.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-8f4f65e6-359f.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/juancarlos.alfaro@uclm.es to make sure we only have a single copy.
      root_path: /Workspace/Users/juancarlos.alfaro@uclm.es/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: juancarlos.alfaro@uclm.es
        level: CAN_MANAGE
